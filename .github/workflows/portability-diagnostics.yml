name: Cocoa anchor placement diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anchor:
    if: github.ref == 'refs/heads/ci/0.8.0-macos-native-followup'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: cocoa
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Qt Widgets
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: ==3.3.0
          py7zrversion: ==1.1.0
      - name: Build and compare native modal placement
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anchor" "$RUNNER_TEMP/cocoa"
          xcrun swift tools/release/prepare_macos_test_display.swift | tee "$RUNNER_TEMP/cocoa/display.log"
          cat > "$RUNNER_TEMP/anchor/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.21)
          project(cocoa_anchor LANGUAGES CXX)
          find_package(Qt6 REQUIRED COMPONENTS Widgets)
          add_executable(cocoa-anchor "$ENV{GITHUB_WORKSPACE}/.github/diagnostics/cocoa_anchor.cpp")
          target_compile_features(cocoa-anchor PRIVATE cxx_std_17)
          target_include_directories(cocoa-anchor PRIVATE "$ENV{GITHUB_WORKSPACE}/src/app/src")
          target_link_libraries(cocoa-anchor PRIVATE Qt6::Widgets)
          CMAKE
          cmake -S "$RUNNER_TEMP/anchor" -B "$RUNNER_TEMP/anchor/build" -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build "$RUNNER_TEMP/anchor/build" --parallel 2
          for mode in hidden modal-hidden shown shown-synced queued modal-queued; do
            for side in right left; do
              "$RUNNER_TEMP/anchor/build/cocoa-anchor" "$mode" "$side" > "$RUNNER_TEMP/cocoa/$mode-$side.log" 2>&1 || true
              grep '^RESULT ' "$RUNNER_TEMP/cocoa/$mode-$side.log"
            done
          done
      - name: Preserve native placement readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-cocoa-followup
          path: ${{ runner.temp }}/cocoa/
          retention-days: 14
