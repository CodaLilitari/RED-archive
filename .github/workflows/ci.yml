name: Windows native release qualification
on:
  push:
    branches: ["ci/0.8.0-windows-display-probe"]
permissions:
  contents: read
jobs:
  windows:
    name: Complete frozen Windows release on native 1080p desktop
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cb449b6820d37b245f5c8f8c7989c897e7ee5d79
          persist-credentials: false
      - name: Record and verify source revision
        shell: pwsh
        run: |
          $revision = git rev-parse HEAD
          Write-Host "Frozen RED source $revision"
          if ($revision -ne 'cb449b6820d37b245f5c8f8c7989c897e7ee5d79') { throw 'Unexpected source revision' }
      - name: Qualify native 1920×1080 on the hosted desktop
        shell: python {0}
        run: |
          import ctypes as c
          import json
          import os
          import subprocess
          import sys
          import time
          from ctypes import wintypes as w

          user = c.WinDLL("user32", use_last_error=True)
          kernel = c.WinDLL("kernel32", use_last_error=True)


          def bind(dll, name, restype, argtypes):
              function = getattr(dll, name)
              function.argtypes = argtypes
              function.restype = restype
              return function


          def log(kind, **values):
              print(kind, json.dumps(values, sort_keys=True), flush=True)


          class Mode(c.Structure):
              _fields_ = [
                  ("device", w.WCHAR * 32), ("spec", w.WORD), ("driver", w.WORD),
                  ("size", w.WORD), ("extra", w.WORD), ("fields", w.DWORD),
                  ("x", w.LONG), ("y", w.LONG), ("orientation", w.DWORD), ("fixed", w.DWORD),
                  ("color", w.SHORT), ("duplex", w.SHORT), ("yres", w.SHORT),
                  ("tt", w.SHORT), ("collate", w.SHORT), ("form", w.WCHAR * 32),
                  ("logpix", w.WORD), ("bpp", w.DWORD), ("width", w.DWORD),
                  ("height", w.DWORD), ("flags", w.DWORD), ("hz", w.DWORD),
                  ("icm_method", w.DWORD), ("icm_intent", w.DWORD), ("media", w.DWORD),
                  ("dither", w.DWORD), ("reserved1", w.DWORD), ("reserved2", w.DWORD),
                  ("pan_width", w.DWORD), ("pan_height", w.DWORD),
              ]


          assert c.sizeof(Mode) == 220
          get_mode = bind(user, "EnumDisplaySettingsExW", w.BOOL, [w.LPCWSTR, w.DWORD, c.POINTER(Mode), w.DWORD])
          change = bind(user, "ChangeDisplaySettingsExW", w.LONG, [w.LPCWSTR, c.POINTER(Mode), w.HWND, w.DWORD, w.LPVOID])
          get_station = bind(user, "GetProcessWindowStation", w.HANDLE, [])
          get_desktop = bind(user, "GetThreadDesktop", w.HANDLE, [w.DWORD])
          input_desktop = bind(user, "OpenInputDesktop", w.HANDLE, [w.DWORD, w.BOOL, w.DWORD])
          close_desktop = bind(user, "CloseDesktop", w.BOOL, [w.HANDLE])
          get_name = bind(user, "GetUserObjectInformationW", w.BOOL, [w.HANDLE, w.INT, w.LPVOID, w.DWORD, c.POINTER(w.DWORD)])
          get_ancestor = bind(user, "GetAncestor", w.HWND, [w.HWND, w.UINT])
          get_foreground = bind(user, "GetForegroundWindow", w.HWND, [])
          set_foreground = bind(user, "SetForegroundWindow", w.BOOL, [w.HWND])
          get_cursor = bind(user, "GetCursorPos", w.BOOL, [c.POINTER(w.POINT)])
          set_cursor = bind(user, "SetCursorPos", w.BOOL, [w.INT, w.INT])
          client_to_screen = bind(user, "ClientToScreen", w.BOOL, [w.HWND, c.POINTER(w.POINT)])
          window_from_point = bind(user, "WindowFromPoint", w.HWND, [w.POINT])
          mouse_event = bind(user, "mouse_event", None, [w.DWORD, w.DWORD, w.DWORD, w.DWORD, c.c_size_t])
          wts = bind(kernel, "WTSGetActiveConsoleSessionId", w.DWORD, [])
          process_session = bind(kernel, "ProcessIdToSessionId", w.BOOL, [w.DWORD, c.POINTER(w.DWORD)])
          thread_id = bind(kernel, "GetCurrentThreadId", w.DWORD, [])
          bind(user, "SetProcessDpiAwarenessContext", w.BOOL, [w.HANDLE])(c.c_void_p(-4))


          def named(handle):
              data = c.create_unicode_buffer(256)
              size = w.DWORD()
              if not handle or not get_name(handle, 2, data, c.sizeof(data), c.byref(size)):
                  return None
              return data.value


          def mode(index):
              m = Mode()
              m.size = c.sizeof(m)
              return m if get_mode(None, index, c.byref(m), 0) else None


          def dims(m):
              return (m.width, m.height, m.bpp, m.hz)


          def probe_window(label):
              import tkinter as tk

              root = tk.Tk()
              root.title("RED disposable hosted input probe")
              x = 1450 if label == "1920x1080" else 70
              y = 710 if label == "1920x1080" else 80
              root.geometry(f"320x180+{x}+{y}")
              results = []
              root.bind("<ButtonPress-1>", lambda e: results.append("press"))
              root.bind("<ButtonRelease-1>", lambda e: results.append("release"))
              def pump():
                  for _ in range(12):
                      root.update()
                      time.sleep(0.025)
              try:
                  pump()
                  client = root.winfo_id()
                  target = get_ancestor(client, 2)
                  initial_fg = get_foreground()
                  accepted = bool(set_foreground(target))
                  pump()
                  foreground_match = target == get_foreground()
                  p = w.POINT(70, 75)
                  converted = bool(client_to_screen(client, c.byref(p)))
                  moved = converted and bool(set_cursor(p.x, p.y))
                  pump()
                  actual = w.POINT()
                  read = bool(get_cursor(c.byref(actual)))
                  hit = window_from_point(actual) if read else None
                  over_own = bool(hit and get_ancestor(hit, 2) == target)
                  if over_own and moved:
                      mouse_event(2, 0, 0, 0, 0)
                      mouse_event(4, 0, 0, 0, 0)
                      pump()
                  rect = w.RECT()
                  work_ok = user.SystemParametersInfoW(0x30, 0, c.byref(rect), 0)
                  log("native-input", mode=label, target_created=bool(target), foreground_existed=bool(initial_fg),
                      set_foreground=accepted, foreground_matched=foreground_match,
                      cursor_set=moved, cursor_read=read, requested=[p.x, p.y], actual=[actual.x, actual.y],
                      hit_own_window=over_own, received=results,
                      tk_dimensions=[root.winfo_screenwidth(), root.winfo_screenheight()],
                      monitor_dimensions=[user.GetSystemMetrics(0), user.GetSystemMetrics(1)],
                      work_area=[rect.left, rect.top, rect.right, rect.bottom] if work_ok else None)
                  if label == "1920x1080":
                      if not (target and foreground_match and moved and read and over_own
                              and actual.x == p.x and actual.y == p.y and actual.x > 1024
                              and results == ["press", "release"]
                              and root.winfo_screenwidth() == 1920 and root.winfo_screenheight() == 1080):
                          raise RuntimeError("The fresh 1920x1080 process could not qualify real foreground and pointer delivery")
              finally:
                  root.destroy()


          if len(sys.argv) == 3 and sys.argv[1] == "child":
              probe_window(sys.argv[2])
              sys.exit(0)


          def fresh_probe(label):
              subprocess.run([sys.executable, os.path.abspath(__file__), "child", label], check=True)


          session = w.DWORD()
          ok = bool(process_session(os.getpid(), c.byref(session)))
          c.set_last_error(0)
          desktop = input_desktop(0, 0, 1)
          desktop_error = c.get_last_error() if not desktop else 0
          log("desktop", process_session=session.value if ok else None, console_session=wts(),
              window_station=named(get_station()), process_desktop=named(get_desktop(thread_id())),
              input_desktop=named(desktop), open_input_error=desktop_error)
          if desktop:
              close_desktop(desktop)
          original = mode(0xffffffff)
          modes = []
          while (m := mode(len(modes))) is not None:
              modes.append(m)
          log("display", current=dims(original) if original else None,
              modes=sorted(set(dims(m) for m in modes)))
          fresh_probe("original")
          if original:
              qualified = False
              try:
                  for width, height in ((1920,1080), (2560,1440)):
                      offered = [m for m in modes if m.width == width and m.height == height and m.bpp == original.bpp]
                      if not offered:
                          log("mode-change", requested=[width,height], offered=False)
                          continue
                      chosen = min(offered, key=lambda m: abs(int(m.hz) - int(original.hz)))
                      copy = Mode.from_buffer_copy(chosen)
                      copy.fields = 0x40000 | 0x80000 | 0x100000 | 0x400000
                      test = change(None, c.byref(copy), None, 2, None)
                      applied = change(None, c.byref(copy), None, 0, None) if test == 0 else None
                      time.sleep(1)
                      current = mode(0xffffffff)
                      log("mode-change", requested=[width,height], offered=True, cds_test=test, applied=applied,
                          actual=dims(current) if current else None)
                      if applied == 0 and current and (current.width,current.height) == (width,height):
                          fresh_probe(str(width) + "x" + str(height))
                          if (width,height) == (1920,1080):
                              qualified = True
                              break
              finally:
                  if not qualified:
                      original.fields = 0x40000 | 0x80000 | 0x100000 | 0x400000
                      restored = change(None, c.byref(original), None, 0, None)
                      log("restore-after-failure", result=restored)
              if not qualified:
                  raise RuntimeError("1920x1080 was unavailable on this runner")
          else:
              raise RuntimeError("Could not read the runner display")
      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -S . -B build/full -G "Ninja Multi-Config" -DSED_CPP_STANDARD=23 -DSED_QT_ROOT="${{ env.QT_ROOT_DIR }}"
      - name: Build
        shell: pwsh
        run: |
          $cores = [Environment]::ProcessorCount
          $availableGiB = (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory / 1MB
          $jobs = [Math]::Max(1, [Math]::Min([Math]::Min(4, $cores), [int][Math]::Floor($availableGiB / 2.5)))
          Write-Host "Logical CPUs $cores; available memory $availableGiB GiB; parallel build jobs $jobs"
          cmake --build build/full --config Release --parallel $jobs
      - name: Complete Windows Release CTest gate
        timeout-minutes: 75
        env:
          QT_OPENGL: software
          QT_QPA_PLATFORM_PLUGIN_PATH: ${{ env.QT_ROOT_DIR }}/plugins/platforms
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [Windows.Forms.Screen]::PrimaryScreen
          Write-Host "Pre-CTest native screen $($screen.Bounds); work area $($screen.WorkingArea)"
          if ($screen.Bounds.Width -ne 1920 -or $screen.Bounds.Height -ne 1080) { throw 'Native full-HD mode no longer active' }
          ctest --test-dir build/full -C Release --output-on-failure --no-tests=error --parallel 1 --output-junit windows-ctest.xml
      - name: Upload Windows test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-diagnostics-native-1080p-cb449b68
          path: |
            build/full/Testing/Temporary/
            build/full/windows-ctest.xml
          if-no-files-found: warn
          retention-days: 14
